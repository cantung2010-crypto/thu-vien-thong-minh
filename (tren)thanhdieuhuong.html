  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <!-- Thương hiệu Thư viện Thông minh -->
      <div class="flex items-center gap-2 sm:gap-2.5 min-w-0 shrink">
        <div class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center text-white shadow-xs shrink-0">
          <i data-lucide="book-open" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0">
          <span class="font-bold text-xs sm:text-base text-gray-950 tracking-tight block truncate">
            THƯ VIỆN THÔNG MINH
          </span>
        </div>
      </div>

      <!-- Các nút thao tác góc phải -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <!-- Nút Gợi ý (Không cần AI ngoài, dùng bộ lọc tâm trạng nội bộ) -->
        <button
          type="button"
          onclick="openPersonalityModal()"
          class="px-2 sm:px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-gradient-to-r from-orange-50 to-purple-50 text-gray-800 border border-orange-200/60 hover:border-orange-300 active:scale-95 transition-all shadow-2xs cursor-pointer"
          title="Gợi ý theo sở thích & tính cách cá nhân"
        >
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-[#FF7A00]"></i>
          <span class="hidden xs:inline sm:inline">Gợi ý tác phẩm</span>
        </button>

        <!-- Nút Quét mã Camera với đèn nháy Ping -->
        <button
          type="button"
          onclick="openScannerModal()"
          class="group relative px-2.5 sm:px-3.5 py-1.5 bg-gradient-to-r from-orange-600 via-amber-600 to-orange-500 hover:from-orange-500 hover:to-amber-500 active:scale-95 text-white rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 shadow-md shadow-orange-600/20 hover:shadow-orange-600/35 shrink-0 cursor-pointer border border-orange-400/40"
          title="Quét mã vạch ISBN sách"
        >
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-200 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
          </span>
          <i data-lucide="camera" class="w-3.5 h-3.5 text-white transition-transform group-hover:scale-110"></i>
          <span class="font-extrabold tracking-tight">Quét mã</span>
        </button>
      </div>
    </div>
  </header>
