<!-- 1. Hộp thoại Quét Camera Barcode -->
  <div id="scannerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-gray-200 text-center">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-gray-900">Quét mã vạch ISBN</h3>
        <button onclick="closeScannerModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 font-bold">✕</button>
      </div>
      <div id="barcodeReaderBox" class="w-full aspect-[4/3] bg-gray-950 rounded-2xl overflow-hidden relative border border-gray-200 flex items-center justify-center text-white text-xs">
        <span class="text-gray-400">Đang khởi động Camera...</span>
      </div>
      <div class="flex gap-2 text-left">
        <input id="manualIsbnInput" type="text" placeholder="Nhập mã ISBN thủ công..." class="flex-1 px-3 py-2 rounded-xl border text-xs font-mono" />
        <button onclick="submitManualIsbn()" class="px-4 py-2 rounded-xl bg-gray-950 text-white text-xs font-bold">Tìm sách</button>
      </div>
    </div>
  </div>

  <!-- 2. Hộp thoại Gợi ý tác phẩm theo tâm trạng -->
  <div id="personalityModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-xs">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-gray-200">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-sm font-black text-gray-900">✨ GỢI Ý TÁC PHẨM PHÙ HỢP</h3>
        <button onclick="closePersonalityModal()" class="w-7 h-7 rounded-full bg-gray-100 font-bold text-xs">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="pickMood('kham-pha')" class="p-3 rounded-xl border hover:border-orange-500 hover:bg-orange-50 text-left">🚀 Phiêu lưu, khám phá</button>
        <button onclick="pickMood('suy-ngam')" class="p-3 rounded-xl border hover:border-orange-500 hover:bg-orange-50 text-left">☕ Lắng đọng, chiêm nghiệm</button>
        <button onclick="pickMood('khoa-hoc')" class="p-3 rounded-xl border hover:border-orange-500 hover:bg-orange-50 text-left">🔬 Tìm hiểu khoa học</button>
        <button onclick="pickMood('truyen-cam-hung')" class="p-3 rounded-xl border hover:border-orange-500 hover:bg-orange-50 text-left">🌟 Nạp năng lượng tích cực</button>
      </div>
    </div>
  </div>

  <!-- 3. Hộp thoại Nhập mật khẩu Quản trị viên (PIN: 101001) -->
  <div id="adminAuthModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-xs">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-gray-200 text-center">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h3 class="text-base font-bold text-gray-900">Xác thực Quản trị viên</h3>
      <input
        id="adminPinInput"
        type="password"
        maxlength="6"
        placeholder="Mã PIN (Mặc định: 101001)"
        class="w-full text-center tracking-[0.3em] font-mono text-lg py-2.5 border border-gray-300 rounded-xl"
        onkeydown="if(event.key==='Enter') verifyAdminPin()"
      />
      <p id="adminPinError" class="hidden text-[11px] text-red-600 font-semibold"></p>
      <div class="flex gap-2">
        <button onclick="closeAdminAuthModal()" class="flex-1 py-2 rounded-xl border text-xs font-semibold text-gray-600">Hủy</button>
        <button onclick="verifyAdminPin()" class="flex-1 py-2 rounded-xl bg-gray-950 text-white text-xs font-bold">Xác nhận</button>
      </div>
    </div>
  </div>

  <!-- 4. Bảng điều khiển Quản trị viên (Thêm & Xóa sách) -->
  <div id="adminDashboardModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-xs">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
        <h3 class="font-extrabold text-sm text-gray-900">⚙️ BẢNG QUẢN TRỊ THƯ VIỆN</h3>
        <button onclick="closeAdminDashboardModal()" class="w-8 h-8 rounded-full bg-gray-200 font-bold text-xs">✕</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6 text-xs text-gray-700">
        <!-- Form thêm sách -->
        <div class="p-4 rounded-2xl bg-amber-50/50 border border-amber-200/80 space-y-3">
          <h4 class="font-bold text-sm text-gray-900">Thêm tác phẩm mới vào thư viện</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <input id="adminBookTitle" type="text" placeholder="Tên tác phẩm (*)..." class="p-2 border rounded-lg bg-white" />
            <input id="adminBookAuthor" type="text" placeholder="Tác giả (*)..." class="p-2 border rounded-lg bg-white" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <input id="adminBookIsbn" type="text" placeholder="Mã ISBN (*)..." class="p-2 border rounded-lg bg-white font-mono" />
            <select id="adminBookCategory" class="p-2 border rounded-lg bg-white">
              <option value="Văn học">Văn học</option>
              <option value="Khoa học">Khoa học</option>
              <option value="Công nghệ">Công nghệ</option>
              <option value="Tâm lý">Tâm lý</option>
            </select>
            <input id="adminBookYear" type="number" value="2024" class="p-2 border rounded-lg bg-white" />
          </div>
          <input id="adminBookCover" type="text" placeholder="Link ảnh bìa sách (https://...)" class="w-full p-2 border rounded-lg bg-white" />
          <textarea id="adminBookSummary" rows="2" placeholder="Tóm tắt ngắn cuốn sách..." class="w-full p-2 border rounded-lg bg-white"></textarea>
          <input id="adminBookMessage" type="text" placeholder="Thông điệp nhân văn đúc kết..." class="w-full p-2 border rounded-lg bg-white" />
          <button onclick="handleAdminAddNewBook()" class="w-full py-2.5 bg-gray-900 hover:bg-black text-white font-bold rounded-xl">
            Lưu sách mới vào cơ sở dữ liệu
          </button>
        </div>

        <!-- Danh sách sách hiện có để xóa -->
        <div class="space-y-3">
          <h4 class="font-bold text-sm text-gray-900">Danh sách sách hiện có (<span id="adminTotalBooksCount">0</span>)</h4>
          <div id="adminBooksListTable" class="divide-y divide-gray-100 border border-gray-200 rounded-xl overflow-hidden bg-white"></div>
        </div>
      </div>
    </div>
  </div>
