      {

        authorBio: "Carl Sagan (1934 - 1996), nhà thiên văn học người Mỹ lừng danh thế giới.",
        characters: []
      }

    let selectedCategory = 'all';
    let searchQuery = '';
    let sortBy = 'popular';
    let currentBook = null;
    let html5QrCode = null;

    // 2. KHỞI CHẠY KHI TẢI TRANG
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderCategoryPills();
      renderBooks();
    });

    // 3. TẠO THANH LỌC THỂ LOẠI
    function renderCategoryPills() {
      const counts = {};
      booksData.forEach(b => { counts[b.category] = (counts[b.category] || 0) + 1; });
      const container = document.getElementById('categoryPills');
      let html = `
        <button onclick="setCategory('all')" class="px-3 py-1.5 rounded-lg text-xs font-medium border cursor-pointer shrink-0 ${
          selectedCategory === 'all' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-200'
        }">Tất cả (${booksData.length})</button>
      `;
      Object.keys(counts).forEach(cat => {
        const isAct = selectedCategory.toLowerCase() === cat.toLowerCase();
        html += `
          <button onclick="setCategory('${cat}')" class="px-3 py-1.5 rounded-lg text-xs font-medium border cursor-pointer shrink-0 ${
            isAct ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-200'
          }">${cat} (${counts[cat]})</button>
        `;
      });
      container.innerHTML = html;
    }

    function setCategory(cat) {
      selectedCategory = cat;
      renderCategoryPills();
      renderBooks();
    }

    // 4. HIỂN THỊ KỆ SÁCH
    function renderBooks() {
      let filtered = booksData.filter(b => {
        const matchCat = selectedCategory === 'all' || b.category.toLowerCase() === selectedCategory.toLowerCase();
        if (!matchCat) return false;
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase().trim();
        return b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q) || b.isbn.toLowerCase().includes(q);
      });

      if (sortBy === 'popular') filtered.sort((a, b) => b.views - a.views);
      else if (sortBy === 'newest') filtered.sort((a, b) => b.year - a.year);
      else if (sortBy === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));

      const grid = document.getElementById('booksGrid');
      const empty = document.getElementById('emptyState');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(b => `
        <div onclick="openBookDetails('${b.id}')" class="bg-white border border-gray-200 rounded-xl p-3 hover:border-amber-400 hover:shadow-md transition-all flex flex-col justify-between cursor-pointer group">
          <div>
            <div class="aspect-[3/4] w-full rounded-lg overflow-hidden bg-gray-100 mb-2 border relative">
              <img src="${b.coverImage}" alt="${b.title}" class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-300" />
            </div>
            <span class="text-[10px] font-medium text-gray-600 bg-gray-100 px-2 py-0.5 rounded inline-block">${b.category}</span>
            <h3 class="font-bold text-xs text-gray-900 line-clamp-2 mt-1">${b.title}</h3>
            <p class="text-[11px] text-gray-500 line-clamp-1">${b.author} • ${b.year}</p>
          </div>
          <div class="pt-2 mt-2 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
            <span class="flex items-center gap-1 text-[11px] text-gray-400">
              <i data-lucide="eye" class="w-3.5 h-3.5"></i><span>${b.views}</span>
            </span>
            <span class="text-[10px] text-amber-700 font-semibold group-hover:underline">Chi tiết →</span>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // 5. TÌM KIẾM & SẮP XẾP
    function handleSearchChange() {
      searchQuery = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      renderBooks();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderBooks();
    }

    function handleSortChange() {
      sortBy = document.getElementById('sortSelect').value;
      renderBooks();
    }

    function resetAllFilters() {
      clearSearch();
      setCategory('all');
    }

    // 6. XEM CHI TIẾT SÁCH (5 TAB)
    function openBookDetails(bookId) {
      currentBook = booksData.find(b => b.id === bookId || b.isbn === bookId);
      if (!currentBook) return;
      currentBook.views += 1;
      document.getElementById('modalCategoryBadge').innerText = currentBook.category;
      document.getElementById('modalBookTitle').innerText = currentBook.title;
      switchTab('overview');
      initChatBox();
      document.getElementById('detailsModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeDetailsModal() {
      document.getElementById('detailsModal').classList.add('hidden');
      renderBooks();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-gray-900', 'text-gray-900', 'font-bold');
        btn.classList.add('border-transparent', 'text-gray-500');
      });
      document.getElementById('tabBtn-' + tab)?.classList.add('border-gray-900', 'text-gray-900', 'font-bold');
      const container = document.getElementById('tabContentContainer');
      const b = currentBook;

      if (tab === 'overview') {
        container.innerHTML = `
          <div class="space-y-3">
            <div class="flex gap-3 bg-white p-3 rounded-xl border">
              <img src="${b.coverImage}" class="w-24 aspect-[3/4] object-cover rounded-lg" />
              <div class="space-y-1 text-xs">
                <p><strong>Tác giả:</strong> ${b.author}</p>
                <p><strong>Thể loại:</strong> ${b.category}</p>
                <p><strong>Mã ISBN:</strong> ${b.isbn}</p>
                <p><strong>Năm xuất bản:</strong> ${b.year}</p>
              </div>
            </div>
            <div class="bg-white p-3 rounded-xl border space-y-1">
              <h4 class="font-bold text-gray-900">Tóm tắt tác phẩm</h4>
              <p class="text-gray-600 leading-relaxed">${b.summary}</p>
            </div>
            <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 text-amber-950">
              <h4 class="font-bold">Thông điệp cốt lõi</h4>
              <p class="italic">"${b.message}"</p>
            </div>
          </div>
        `;
      } else if (tab === 'plot') {
        container.innerHTML = `
          <div class="bg-white p-4 rounded-xl border space-y-3">
            <h4 class="font-bold">Diễn biến cốt truyện chính</h4>
            ${b.plot.map(p => `
              <div class="border-l-2 border-indigo-400 pl-3 py-1">
                <h5 class="font-bold text-gray-900">${p.event}</h5>
                <p class="text-gray-600">${p.desc}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (tab === 'author') {
        container.innerHTML = `
          <div class="bg-white p-4 rounded-xl border space-y-2">
            <h4 class="font-bold">Tiểu sử tác giả</h4>
            <p class="text-gray-700">${b.authorBio}</p>
          </div>
        `;
      } else if (tab === 'characters') {
        container.innerHTML = `
          <div class="space-y-2">
            <h4 class="font-bold">Tuyến nhân vật chính</h4>
            ${b.characters.map(c => `
              <div class="p-3 bg-white rounded-xl border">
                <span class="font-bold text-gray-900">${c.name}</span>
                <span class="text-[10px] text-sky-700 ml-2">(${c.role})</span>
                <p class="text-gray-600 mt-1">${c.trait}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (tab === 'message') {
        container.innerHTML = `
          <div class="bg-white p-4 rounded-xl border space-y-2">
            <h4 class="font-bold">Bài học đúc kết</h4>
            ${b.keyTakeaways.map((t, idx) => `
              <div class="p-2 rounded bg-gray-50 border flex gap-2">
                <span class="font-bold text-amber-600">${idx+1}.</span>
                <span>${t}</span>
              </div>
            `).join('')}
          </div>
        `;
      }
      lucide.createIcons();
    }

    // 7. TRA CỨU THÔNG TIN SÁCH NỘI BỘ
    function initChatBox() {
      document.getElementById('chatMessagesBox').innerHTML = `
        <div class="p-3 bg-white rounded-xl border text-gray-700">
          Đã mở tác phẩm <strong>"${currentBook.title}"</strong>. Hãy đặt câu hỏi về tác giả, bài học hoặc nội dung sách.
        </div>
      `;
    }

    function askPreset(prompt) {
      document.getElementById('chatInput').value = prompt;
      handleSendChat();
    }

    function handleSendChat(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('chatInput');
      const q = input.value.trim();
      if (!q || !currentBook) return;

      const box = document.getElementById('chatMessagesBox');
      box.innerHTML += `<div class="p-2.5 bg-gray-900 text-white rounded-xl text-right ml-auto max-w-[85%] font-medium">${q}</div>`;
      input.value = '';

      const b = currentBook;
      const lower = q.toLowerCase();
      let answer = '';

      if (lower.includes('thông điệp') || lower.includes('ý nghĩa')) {
        answer = `Thông điệp của cuốn sách:\n"${b.message}"`;
      } else if (lower.includes('bài học') || lower.includes('đúc kết')) {
        answer = `Bài học then chốt:\n` + b.keyTakeaways.map((t, i) => `${i+1}. ${t}`).join('\n');
      } else if (lower.includes('tác giả')) {
        answer = `Tác phẩm của tác giả ${b.author} (${b.year}). ${b.authorBio}`;
      } else {
        answer = `Tác phẩm "${b.title}": ${b.summary}`;
      }

      box.innerHTML += `<div class="p-3 bg-white rounded-xl border text-gray-800 whitespace-pre-line leading-relaxed">${answer}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    // 8. MÁY QUÉT CAMERA & GỢI Ý
    function openScannerModal() {
      document.getElementById('scannerModal').classList.remove('hidden');
      setTimeout(() => {
        try {
          if (!html5QrCode) html5QrCode = new Html5Qrcode("barcodeReaderBox");
          html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 180 } },
            (decodedText) => { html5QrCode.stop(); closeScannerModal(); lookupIsbn(decodedText); }, () => {}
          );
        } catch (e) {}
      }, 300);
    }
    function closeScannerModal() {
      document.getElementById('scannerModal').classList.add('hidden');
      if (html5QrCode) { try { html5QrCode.stop(); } catch(e){} }
    }
    function submitManualIsbn() {
      const code = document.getElementById('manualIsbnInput').value.trim();
      if (!code) return;
      closeScannerModal();
      lookupIsbn(code);
    }
    function lookupIsbn(isbn) {
      const b = booksData.find(x => x.isbn === isbn || isbn.includes(x.isbn));
      if (b) openBookDetails(b.id);
      else alert("Không tìm thấy sách với mã ISBN: " + isbn);
    }

    function openPersonalityModal() { document.getElementById('personalityModal').classList.remove('hidden'); }
    function closePersonalityModal() { document.getElementById('personalityModal').classList.add('hidden'); }
    function pickMood(mood) {
      closePersonalityModal();
      let targetId = 'book-hoang-tu-be';
      if (mood === 'kham-pha') targetId = 'book-de-men';
      else if (mood === 'khoa-hoc') targetId = 'book-cosmos';
      else if (mood === 'suy-ngam') targetId = 'book-kieu';
      openBookDetails(targetId);
    }

    // 9. QUẢN TRỊ VIÊN (MẬT KHẨU 101001 & THÊM/XÓA SÁCH)
    function openAdminAuthModal() {
      document.getElementById('adminPinInput').value = '';
      document.getElementById('adminPinError').classList.add('hidden');
      document.getElementById('adminAuthModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('adminPinInput').focus(), 100);
    }
    function closeAdminAuthModal() { document.getElementById('adminAuthModal').classList.add('hidden'); }

    function verifyAdminPin() {
      const pin = document.getElementById('adminPinInput').value.trim();
      if (pin === '101001') {
        closeAdminAuthModal();
        openAdminDashboardModal();
      } else {
        const err = document.getElementById('adminPinError');
        err.innerText = '❌ Mật khẩu không đúng!';
        err.classList.remove('hidden');
      }
    }

    function openAdminDashboardModal() {
      renderAdminBooksList();
      document.getElementById('adminDashboardModal').classList.remove('hidden');
      lucide.createIcons();
    }
    function closeAdminDashboardModal() { document.getElementById('adminDashboardModal').classList.add('hidden'); }

    function renderAdminBooksList() {
      document.getElementById('adminTotalBooksCount').innerText = booksData.length;
      document.getElementById('adminBooksListTable').innerHTML = booksData.map(b => `
        <div class="p-3 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <img src="${b.coverImage}" class="w-8 h-10 object-cover rounded border" />
            <div>
              <h5 class="font-bold text-xs text-gray-900">${b.title}</h5>
              <p class="text-[11px] text-gray-500">${b.author} • ${b.isbn}</p>
            </div>
          </div>
          <button onclick="handleAdminDeleteBook('${b.id}')" class="px-2 py-1 text-xs text-red-600 border border-red-200 rounded hover:bg-red-50">Xóa</button>
        </div>
      `).join('');
    }

    function handleAdminAddNewBook() {
      const title = document.getElementById('adminBookTitle').value.trim();
      const author = document.getElementById('adminBookAuthor').value.trim();
      const isbn = document.getElementById('adminBookIsbn').value.trim();
      const category = document.getElementById('adminBookCategory').value;
      const year = parseInt(document.getElementById('adminBookYear').value) || 2024;
      const coverImage = document.getElementById('adminBookCover').value.trim() || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600';
      const summary = document.getElementById('adminBookSummary').value.trim() || 'Tác phẩm mới được bổ sung.';
      const message = document.getElementById('adminBookMessage').value.trim() || 'Giá trị nhân văn cao đẹp.';

      if (!title || !author || !isbn) {
        alert('Vui lòng nhập Tên tác phẩm, Tác giả và Mã ISBN!');
        return;
      }

      booksData.unshift({
        id: 'book-' + Date.now(),
        title, author, isbn, category, year,
        views: 0, coverImage, description: summary, summary, message,
        keyTakeaways: [summary, message],
        plot: [{ event: "Nội dung", desc: summary }],
        authorBio: `Tác giả ${author}.`,
        characters: []
      });

      alert(`✓ Đã thêm thành công cuốn sách: "${title}"!`);
      closeAdminDashboardModal();
      renderCategoryPills();
      renderBooks();
    }

    function handleAdminDeleteBook(bookId) {
      if (confirm('Bạn có chắc muốn xóa cuốn sách này?')) {
        booksData = booksData.filter(b => b.id !== bookId);
        renderAdminBooksList();
        renderCategoryPills();
        renderBooks();
      }
    }
  </script>
</body>
</html>
