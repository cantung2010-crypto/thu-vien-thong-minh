
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện thông minh</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>THƯ VIỆN THÔNG MINH</h1>
        <p>Khám phá tri thức cùng công nghệ</p>
    </header>

    <main>

        <h2>Danh sách sách</h2>

        <form action="/" method="GET">

            <input
                type="text"
                name="search"
                placeholder="Nhập tên sách hoặc tác giả..."
                value="{{ search }}"
            >

            <select name="category">
                <option value="all">Tất cả thể loại</option>
                <option value="Văn học">Văn học</option>
                <option value="Lịch sử">Lịch sử</option>
            </select>

            <select name="sort">
                <option value="popular">Mặc định</option>
                <option value="name">Tên sách</option>
                <option value="year">Năm xuất bản</option>
            </select>

            <button type="submit">Tìm kiếm</button>

        </form>

        <div class="book-list">

            {% for book in books %}

            <div class="book-card">

                <img src="{{ book.image }}" alt="{{ book.title }}">

                <h3>{{ book.title }}</h3>

                <p>Tác giả: {{ book.author }}</p>

                <p>Thể loại: {{ book.category }}</p>

                <a href="{{ url_for('book_detail', book_id=book.id) }}">
                    Xem chi tiết
                </a>

            </div>

            {% else %}

            <p>Không tìm thấy sách phù hợp.</p>

            {% endfor %}

        </div>

    </main>

    <footer>
        <p>© 2026 - Thư viện điện tử thông minh</p>
    </footer>

</body>
</html>
