<!-- Khung nội dung chính -->
  <main class="max-w-6xl mx-auto px-3 sm:px-4 py-6 sm:py-8 space-y-6 pb-28 md:pb-12 flex-1 w-full">
    
    <!-- Hàng tìm kiếm & sắp xếp -->
    <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3.5 sm:top-3"></i>
        <input
          id="searchInput"
          type="text"
          placeholder="Tìm kiếm theo tên sách, tác giả, thể loại, mã ISBN..."
          oninput="handleSearchChange()"
          class="w-full pl-9 pr-8 py-2.5 sm:py-2 text-base sm:text-sm border border-gray-200 rounded-xl bg-white focus:outline-none focus:border-gray-900 transition-colors shadow-2xs"
        />
        <button
          id="clearSearchBtn"
          type="button"
          onclick="clearSearch()"
          class="hidden absolute right-3 top-3.5 sm:top-3 text-gray-400 hover:text-gray-700 cursor-pointer"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Sắp xếp -->
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-xs text-gray-500 font-medium">Sắp xếp:</span>
        <div class="flex items-center gap-1 border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs bg-white shadow-2xs">
          <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-gray-400"></i>
          <select id="sortSelect" onchange="handleSortChange()" class="bg-transparent font-medium focus:outline-none cursor-pointer text-xs">
            <option value="popular">Phổ biến nhất</option>
            <option value="newest">Mới nhất</option>
            <option value="title">Tên sách (A-Z)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Thanh nút chọn thể loại -->
    <div id="categoryPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1"></div>

    <!-- Thông báo kết quả tìm kiếm -->
    <div id="searchNotice" class="hidden flex items-center justify-between text-xs text-gray-500 pt-2 border-t border-gray-100">
      <span id="searchNoticeText"></span>
      <button onclick="clearSearch()" class="text-gray-700 underline font-medium cursor-pointer">Xóa tìm kiếm</button>
    </div>

    <!-- Lưới hiển thị các thẻ sách -->
    <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5"></div>

    <!-- Trạng thái trống nếu không có kết quả -->
    <div id="emptyState" class="hidden text-center py-16 border border-dashed border-gray-200 rounded-xl space-y-2">
      <i data-lucide="book-open" class="w-8 h-8 text-gray-300 mx-auto"></i>
      <p class="text-sm font-semibold text-gray-700">Không tìm thấy sách phù hợp</p>
      <button onclick="resetAllFilters()" class="mt-2 px-3 py-1.5 bg-gray-900 text-white rounded-lg text-xs font-medium cursor-pointer">
        Xem tất cả sách
      </button>
    </div>
  </main>
