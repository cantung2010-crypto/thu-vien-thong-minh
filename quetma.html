  <div id="scannerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-gray-200 text-center">
      <div class="flex items-center justify-between">
        <div class="text-left">
          <h3 class="text-base font-bold text-gray-900">Quét mã vạch ISBN</h3>
          <p class="text-[11px] text-gray-500">Đưa camera về phía mã vạch sau bìa sách</p>
        </div>
        <button onclick="closeScannerModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-700 font-bold">✕</button>
      </div>
      
      <!-- Khung Camera quét mã vạch quang học -->
      <div id="barcodeReaderBox" class="w-full aspect-[4/3] bg-gray-950 rounded-2xl overflow-hidden relative border border-gray-200 flex items-center justify-center text-white text-xs">
        <span class="text-gray-400">Đang bật Camera quét mã...</span>
      </div>

      <!-- Hoặc nhập mã thủ công -->
      <div class="space-y-2 pt-1 text-left">
        <p class="text-[11px] text-gray-400 font-medium">Hoặc nhập mã ISBN thủ công:</p>
        <div class="flex gap-2">
          <input
            id="manualIsbnInput"
            type="text"
            placeholder="Ví dụ: STK-006073 hoặc 9786042171922"
            class="flex-1 px-3 py-2 rounded-xl border text-xs font-mono focus:outline-none focus:ring-1 focus:ring-orange-500"
          />
          <button onclick="submitManualIsbn()" class="px-4 py-2 rounded-xl bg-gray-950 text-white text-xs font-bold hover:bg-gray-800">
            Tìm sách
          </button>
        </div>
      </div>
    </div>
  </div>
